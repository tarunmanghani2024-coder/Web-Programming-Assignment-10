<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient( blue ,skyblue);
        }
        form {
            height: 600px;
            width: 430px;
            padding: 20px;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
        }
        form:hover {
            box-shadow: 0 0 10px 1px rgba(0, 0, 0, 0.2);
        }
        h1 {
            text-align: center;
            margin: 10px 0;
        }
        .inputs {
            display: flex;
            flex-direction: column;
            height: 70%;
        }
        label {
            font-weight: bold;
            margin: 5px 0;
        }
        input {
            border-radius: 8px;
            border: 1px solid black;
            padding: 10px 6px;
            font-size: 16px;
        }
        a {
            text-align: center;
            color: black;
            font-size: 16px;
            text-decoration: none;
        }
        a:hover {
            color: rgb(12, 0, 70);
            text-decoration: underline;
        }
        p {
            text-align: center;
        }
        button {
            padding: 10px;
            font-size: 24px;
            font-weight: bolder;
            border-radius: 16px;
            border: none;
            background: linear-gradient( blue ,skyblue);
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: hsl(240, 54%, 21%);
        }
    </style>
</head>
<body>
    <form action="">
        <h1 align="center">sign up</h1>
        <div class="basic">
            <label for="">First Name</label> &nbsp;           &nbsp;        &nbsp;                 &nbsp;                               &nbsp;         &nbsp;            &nbsp;
            <input type="text" name="" id=""><br>
            <label for="">last Name</label> &nbsp;           &nbsp;          &nbsp;     &nbsp;                 &nbsp;                               &nbsp;         &nbsp;            &nbsp;
            <input type="text" name="" id=""><br>
            <label for="">Gender</label> &nbsp;       &nbsp;         &nbsp;            &nbsp;         &nbsp;     &nbsp;                 &nbsp;                               &nbsp;         &nbsp;            &nbsp;
            <input type="Radio">Male
            <input type="Radio">female<br>
            <label for="">Date of Birth</label>                            &nbsp;       &nbsp;                               &nbsp;         &nbsp;            &nbsp;
            <input type="date" name="" id=""><br>
            <label for="">Phone no.</label>                &nbsp;             &nbsp;                       &nbsp;       &nbsp;                               &nbsp;         &nbsp;            &nbsp;
            <input type="tel" name="" id="">
        </div>
        <div class="email">

        </div>
        <div class="password">
            <label for="">Password</label>               &nbsp;             &nbsp;                       &nbsp;       &nbsp;                               &nbsp;         &nbsp;            &nbsp;
            <input type="password" name="" id=""><br>
            <label for="">confirm password</label>
            <input type="password" name="" id="">
        </div>
        <div class="button">
            <input type="checkbox" name="" id="">
            Term and Conditions<br>
           <center> <button>Signup</button></center>
            <p>Already a Member ? <a href=""></a></p>
        </div>
    </form>
</body>
</html>
